<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Article List</title>
    <style>
        li {
        list-style-type: none;
        }

        ul a {
               color:  crimson;
        }
    </style>
</head>
<body>
<h1>Article List</h1>
<div class="articles">
{% for article in articles %}
<ul>
    <a href="http://"><h2>{{ article.title }}</h2></a>
    <p>{{ article.body }}</p>
    <li>{{ article.date }}</li>
</ul>
{% endfor %}
</div>
</body>
</html>
