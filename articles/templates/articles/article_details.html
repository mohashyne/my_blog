{% extends 'base_layout.html' %}

{% block content %}
<div class="article-details">
<h1>Article Details</h1>
    <h2>{{ article.title }}</h2>
     <img  style="
        width: 600px;
        height: 250px;
        border-radius: 5px;"  src="{{ article.thumb.url }}">
    <p>{{ article.body }}</p>
    <p>{{ article.date }} </p>

</div>

{% endblock %}
