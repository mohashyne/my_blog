{% extends 'base_layout.html' %}

{% block content %}
<h1>Article List</h1>
<div class="articles">

    <a href="http://"><h2>{{ article.title }}</h2></a>
    <canvas class="article-cover" width="300" height="200"></canvas>
    <p>{{ article.body }}</p>
    <li>{{ article.date }}</li>
</div>
</div>
